<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOP Tools | Modern Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'post-blue': '#0A58CA',
                        'post-red': '#DC3545',
                        'post-dark': '#0F172A',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at top right, #f8fafc, #ffffff);
            min-height: 100vh;
        }

        .dark body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        /* Modern Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Sleek List Items */
        .post-list-item {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid transparent;
        }

        .post-list-item:hover {
            background: rgba(10, 88, 202, 0.04);
            border-left-color: #0A58CA;
            transform: translateX(6px);
        }

        .dark .post-list-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-left-color: #DC3545;
        }

        /* Search Input Focus */
        .post-input:focus {
            box-shadow: 0 0 0 4px rgba(10, 88, 202, 0.1);
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>

<body class="antialiased text-slate-800 dark:text-slate-200 p-4 sm:p-12">

    <div id="app-container" class="max-w-xl mx-auto">
        <div class="glass-card rounded-3xl shadow-xl overflow-hidden">
            
            <div class="p-8 pb-4">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-3xl font-black bg-gradient-to-r from-post-blue to-blue-500 bg-clip-text text-transparent dark:from-post-red dark:to-orange-400">
                            DOP Tools
                        </h1>
                        <p class="text-xs font-semibold uppercase tracking-widest text-slate-400 mt-1">Resource Hub</p>
                    </div>

                    <button id="themeToggle" class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:scale-105 transition-all active:scale-95">
                        <svg id="sunIcon" class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/></svg>
                        <svg id="moonIcon" class="w-5 h-5 text-indigo-400 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                    </button>
                </div>

                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 group-focus-within:text-post-blue transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search for tools..." 
                        class="post-input w-full pl-11 pr-12 py-4 bg-slate-50 dark:bg-slate-900/50 border-none rounded-2xl text-sm font-medium focus:ring-0 transition-all outline-none">
                    
                    <button id="clearButton" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-post-red hidden">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <div class="px-2 pb-8">
                <ul id="websiteList" class="space-y-1">
                    </ul>

                <div id="noResults" class="hidden py-12 text-center">
                    <p class="font-bold text-slate-500">No tools found</p>
                    <p class="text-xs text-slate-400 mt-1">Try another search term</p>
                </div>
            </div>
        </div>

        <footer class="mt-8 text-center">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">Department of Posts • Regional Hub</p>
        </footer>
    </div>

    <script>
        const initialWebsites = [
            { name: "Official Savings Bank", url: "https://www.indiapost.gov.in/banking-services/saving", tag: "POSB" },
            { name: "Post Office Reminders", url: "https://falendra-sahu.github.io/Post-Office-Reminders", tag: "Task" },
            { name: "Payment Date Calculator", url: "https://falendra-sahu.github.io/Payment-Date-Calculator", tag: "Calc" },
            { name: "RD Interest Calculator", url: "https://falendra-sahu.github.io/Post-Office-RD-Calculator", tag: "Calc" },
            { name: "Collection Date Analyzer", url: "https://falendra-sahu.github.io/Collection-Date-Analyzer", tag: "Data" },
        ];

        const renderInitialList = () => {
            const list = document.getElementById('websiteList');
            list.innerHTML = initialWebsites.map(site => `
                <li class="post-list-item px-6 py-4 cursor-pointer" data-search-term="${site.name.toLowerCase()} ${site.url.toLowerCase()}">
                    <a href="${site.url}" target="_blank" class="flex justify-between items-center group">
                        <div class="flex-grow pr-4">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="font-bold text-sm text-slate-800 dark:text-slate-100">${site.name}</span>
                                <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold uppercase tracking-tight">${site.tag}</span>
                            </div>
                            <span class="text-xs text-slate-400 truncate block font-medium">${site.url.replace('https://', '')}</span>
                        </div>
                        <div class="p-2 rounded-xl text-slate-300 group-hover:text-post-blue dark:group-hover:text-post-red transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        </div>
                    </a>
                </li>
            `).join('');
        };

        const setupTheme = () => {
            const html = document.documentElement;
            const toggle = document.getElementById('themeToggle');
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');

            const apply = (isDark) => {
                html.classList.toggle('dark', isDark);
                sun.classList.toggle('hidden', isDark);
                moon.classList.toggle('hidden', !isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };

            let isDark = localStorage.getItem('theme') === 'dark' || 
                         (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            apply(isDark);
            toggle.onclick = () => { isDark = !html.classList.contains('dark'); apply(isDark); };
        };

        document.addEventListener('DOMContentLoaded', () => {
            setupTheme();
            renderInitialList();
            
            const search = document.getElementById('searchInput');
            const clear = document.getElementById('clearButton');
            const items = document.querySelectorAll('.post-list-item');

            search.oninput = () => {
                const val = search.value.toLowerCase();
                let visible = 0;
                
                clear.style.display = val ? 'block' : 'none';
                
                items.forEach(item => {
                    const match = item.dataset.searchTerm.includes(val);
                    item.style.display = match ? 'block' : 'none';
                    if(match) visible++;
                });

                document.getElementById('noResults').classList.toggle('hidden', visible > 0);
            };

            clear.onclick = () => { search.value = ''; search.oninput(); search.focus(); };
            search.focus();
        });
    </script>
</body>
</html>
